# Amanah — protected staging (synthetic test data only). PREPARED, NOT DEPLOYED.
# Standalone: own project name, containers, network and database volume; nothing is shared
# with production. The app listens on 127.0.0.1 only; access goes through Caddy with basic
# auth (deploy/Caddyfile.staging-snippet). See docs/strategy/22-staging-und-pilot.md.
#
#   cp .env.staging.example .env.staging     # fill in staging-only secrets, never commit
#   set -a; source .env.staging; set +a; node scripts/validate-staging-env.mjs
#   docker compose -p amanah-staging -f docker-compose.staging.yml --env-file .env.staging up -d --build

name: amanah-staging

# Staging may share a host with production: hard caps on memory, CPU and log size so it can never
# starve other services. Images can be built elsewhere and loaded (`up -d --no-build`).
x-limits: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    image: amanah-staging-migrate:${AMANAH_RELEASE:-local}
    container_name: amanah-staging-migrate
    restart: "no"
    mem_limit: 512m
    cpus: 1.0
    <<: *logging
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - staging_db

  postgres:
    image: postgres:16-alpine
    container_name: amanah-staging-postgres
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    <<: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-amanah_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.staging}
      POSTGRES_DB: ${POSTGRES_DB:-amanah_staging}
    volumes:
      - amanah_pg_staging:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - staging_db

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_AUTH_MODE: api
        NEXT_PUBLIC_STORAGE_MODE: api
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in .env.staging}
        NEXT_PUBLIC_AMANAH_ENVIRONMENT: staging
        NEXT_PUBLIC_AMANAH_PUBLIC_REGISTRATION_ENABLED: "true"
    image: amanah-staging-app:${AMANAH_RELEASE:-local}
    container_name: amanah-staging-app
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    <<: *logging
    ports:
      - "127.0.0.1:${STAGING_APP_PORT:-3201}:3000"
    environment:
      NODE_ENV: production
      AMANAH_DEPLOYMENT_ENV: staging
      NEXT_PUBLIC_AMANAH_ENVIRONMENT: staging
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.staging}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env.staging}
      AMANAH_SERVER_STORAGE: postgres
      AMANAH_DATA_KEYS: ${AMANAH_DATA_KEYS:?Set staging-only AMANAH_DATA_KEYS}
      AMANAH_DATA_KEY_ACTIVE: ${AMANAH_DATA_KEY_ACTIVE:?Set AMANAH_DATA_KEY_ACTIVE}
      AMANAH_DATA_ENCRYPTION: required
      AMANAH_PUBLIC_BASE_URL: ${AMANAH_PUBLIC_BASE_URL:?Set AMANAH_PUBLIC_BASE_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_AUTH_MODE: api
      NEXT_PUBLIC_STORAGE_MODE: api
      AMANAH_PUBLIC_REGISTRATION_ENABLED: "true"
      AMANAH_REGISTRATION_ALLOWED_DOMAINS: ${AMANAH_REGISTRATION_ALLOWED_DOMAINS:-staging.invalid}
      AMANAH_MAIL_TRANSPORT: outbox
      # Outbox endpoint for synthetic test accounts only; editorial/review pages stay unreachable
      AMANAH_DEV_OUTBOX: "true"
      AMANAH_INTERNAL_TOOLS: "false"
      # sandbox (built-in test checkout) or stripe_test (Stripe test mode of the Amanah account, docs 25)
      AMANAH_BILLING_MODE: ${AMANAH_BILLING_MODE:-sandbox}
      AMANAH_BILLING_ENFORCE: "false"
      AMANAH_SANDBOX_WEBHOOK_SECRET: ${AMANAH_SANDBOX_WEBHOOK_SECRET:?Set AMANAH_SANDBOX_WEBHOOK_SECRET}
      AMANAH_STRIPE_SECRET_KEY: ${AMANAH_STRIPE_SECRET_KEY:-}
      AMANAH_STRIPE_WEBHOOK_SECRET: ${AMANAH_STRIPE_WEBHOOK_SECRET:-}
      AMANAH_TEST_PRICE_VORSORGE_PLUS_CENTS: "3900"
      AMANAH_LEGACY_VERIFICATION_GRACE_DAYS: ${AMANAH_LEGACY_VERIFICATION_GRACE_DAYS:-60}
      AMANAH_AI_ENABLED: "false"
      NEXT_PUBLIC_AMANAH_AI_ENABLED: "false"
      AMANAH_AI_PROVIDER: rules
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - staging_db
      - staging_edge

networks:
  # Database network without any route to the outside; only migrate and app join it.
  staging_db:
    name: amanah_staging_db
    driver: bridge
    internal: true
  # App only: published on 127.0.0.1 for Caddy, outbound for the Stripe test API.
  staging_edge:
    name: amanah_staging_edge
    driver: bridge

volumes:
  amanah_pg_staging:
    name: amanah_pg_staging
