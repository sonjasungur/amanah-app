# Shared-server overlay: no dedicated Caddy (ports 80/443 already in use).
# App reachable on localhost:3001 for server-side smoke tests only.
# The app stays on its internal network: this overlay must never attach it to the shared proxy's network.
#
# Usage:
#   docker compose -f docker-compose.prod.yml -f docker-compose.prod.nocaddy.yml \
#     --env-file .env.production up -d --build

services:
  app:
    ports:
      - "127.0.0.1:3001:3000"
